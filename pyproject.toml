[project]
name = "xfh"
description = "Recover Amiga XPK files, including files written through XFH"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "xfh contributors" }]
keywords = ["amiga", "compression", "data-recovery", "xpk", "xfh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Compression",
]
dependencies = []

[project.urls]
Issues = "https://github.com/bitplane/xfh/issues"
Repository = "https://github.com/bitplane/xfh"

[project.scripts]
xfh = "xfh.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "coverage>=7.6",
    "flit_core>=3.10",
    "hypothesis>=6.100",
    "pre-commit>=4",
    "pydoc-markdown>=4.8",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.9",
    "twine>=6",
]

[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core>=3.10,<4"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["xfh"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.flit.sdist]
include = [
    ".pre-commit-config.yaml",
    ".shellcheckrc",
    "Makefile",
    "docs/",
    "scripts/",
    "tests/",
    "tools/",
]
